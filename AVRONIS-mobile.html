<style>
:root{--bg:#0b0f14;--surface:#111820;--surface2:#1a2230;--border:#2a3a4f;--accent:#3d8ef0;--green:#2ecc71;--red:#e74c3c;--text:#e8edf3;--text2:#7a8fa6;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 60px}
.logo{text-align:center;padding:24px 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px}
.logo-icon{font-size:36px;margin-bottom:8px}
.logo-title{font-size:20px;font-weight:700}
.logo-sub{font-size:12px;color:var(--text2);margin-top:4px}
.choice-btn{display:block;width:100%;padding:18px;margin-bottom:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;cursor:pointer;text-align:left}
.choice-btn:active{opacity:.7}
.ci{font-size:28px;display:block;margin-bottom:6px}
.ct{font-weight:700;display:block;font-size:16px}
.cs{font-size:12px;color:var(--text2);display:block;margin-top:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:16px;border-radius:10px;border:none;cursor:pointer;font-size:16px;font-weight:700;width:100%;margin-top:12px}
.btn-p{background:var(--accent);color:#fff}
.btn-s{background:var(--green);color:#fff}
.btn-g{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.back{background:none;border:none;color:var(--text2);font-size:13px;padding:0 0 16px;cursor:pointer;display:block}
.fg{margin-bottom:14px}
label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--text);font-size:15px;-webkit-appearance:none;outline:none;font-family:inherit}
input:focus{border-color:var(--accent)}
.sh{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 10px}
.kb{display:block;width:100%;padding:16px;margin-bottom:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.kb:active{opacity:.7}
.kb span{font-size:11px;color:var(--text2);float:right;margin-top:3px;font-weight:400}
.sw{text-align:center;padding:50px 20px}
.si{font-size:72px;margin-bottom:16px;display:block}
.st{font-size:22px;font-weight:700;margin-bottom:8px}
.ss{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:4px}
.rn{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 18px;font-family:monospace;font-size:16px;color:var(--accent);margin:14px 0}
.ir{display:flex;gap:8px;margin-bottom:8px}
.ir .n{flex:2}
.ir .q{flex:0 0 72px}
.db{flex:0 0 40px;height:48px;background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.3);border-radius:8px;color:var(--red);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.step{display:none}.step.active{display:block}
.ib{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.5}
.rr{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px}
.rr:last-child{border-bottom:none}
.rq{font-weight:700;flex-shrink:0;color:var(--accent)}
.rp{font-size:10px;color:var(--text2);font-family:monospace}
.sp{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.wi{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.wi:last-child{border-bottom:none}
.wcb{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.wq{width:60px;padding:8px;font-size:13px;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text)}
</style>
</head>

const WH=[{n:'Прокладка РА60А-001',p:'РА60А-001'},{n:'Трубка РА60-135',p:'РА60-135'},{n:'Кільце У-14-2,5 НТА',p:'У-14-2,5 НТА'},{n:'Кільце У-19,5-2,5 НТА',p:'У-19,5-2,5 НТА'},{n:'Кільце У-10-2 НТА',p:'У-10-2 НТА'},{n:'Прокладка КАУ30Б-015',p:'КАУ30Б-015'},{n:'Контровка РА16-409А',p:'РА16-409А'},{n:'Контровка КАУ30-005А',p:'КАУ30-005А'},{n:'Прокладка ПФ-69,8-64,2',p:'ПФ-69,8-64,2'},{n:'Прокладка ПФ-44,2-32,2',p:'ПФ-44,2-32,2'},{n:'Втулка ПМ15-681',p:'ПМ15-681'},{n:'Пружина РА60А-021А',p:'РА60А-021А'},{n:'Кільце У-60-3,5-Г1',p:'У-60-3,5-Г1'},{n:'Сітка РА10Д-407',p:'РА10Д-407'},{n:'Прокладка ПФС-32-27',p:'ПФС-32-27'},{n:'Шайба КАУ30Б-044',p:'КАУ30Б-044'},{n:'Кільце КАУ30Б-042',p:'КАУ30Б-042'},{n:'Пломба ОСТ 1 10067-71',p:'ОСТ 1 10067-71'},{n:'Кільце У-13-2-А',p:'У-13-2-А'},{n:'Кільце У-25-3 НТА',p:'У-25-3 НТА'}];

let mode='',items=[],user={},ws={};
function go(s,t){document.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));if(s===0){document.getElementById('s0').classList.add('active');return;}if(s===1){if(t)mode=t;document.getElementById('s1').classList.add('active');return;}document.getElementById('s-'+s).classList.add('active');if(s==='wh')rwh('');}
function s1next(){const e=document.getElementById('exec').value.trim();if(!e){alert('Введіть ПІБ');return;}user={executor:e,aggregate:document.getElementById('agg').value.trim(),project:document.getElementById('proj').value.trim(),workplace:document.getElementById('wp').value.trim()};if(mode==='kit')go('kit');else if(mode==='manual')go('manual');else go('wh');}
function selKit(k){const kit=KITS[k];items=kit.i.map(x=>({name:x.n,pn:x.pn,qty:x.q,unit:'шт'}));user.aggregate=user.aggregate||kit.l;user.kitL=kit.l;showRv();}
function addRow(){const d=document.createElement('div');d.className='ir';d.innerHTML='<input type="text" placeholder="Найменування" class="n"><input type="number" placeholder="К-сть" class="q" value="1" min="1"><button class="db" onclick="delRow(this)">&#x2715;</button>';document.getElementById('mrows').appendChild(d);}
function delRow(b){const r=document.querySelectorAll('.ir');if(r.length>1)b.closest('.ir').remove();}
function manNext(){items=[];document.querySelectorAll('.ir').forEach(r=>{const n=r.querySelector('.n').value.trim();if(!n)return;items.push({name:n,pn:'',qty:parseFloat(r.querySelector('.q').value)||1,unit:'шт'});});if(!items.length){alert('Введіть позиції');return;}showRv();}
function rwh(q){const f=WH.filter(x=>!q||x.n.toLowerCase().includes(q.toLowerCase())||x.p.toLowerCase().includes(q.toLowerCase()));document.getElementById('whl').innerHTML=f.map(x=>`<div class="wi"><input type="checkbox" class="wcb" ${ws[x.p]?'checked':''} onchange="tw('${x.p.replace(/'/g,'')}')"><div style="flex:1"><div style="font-size:14px">${x.n}</div><div style="font-size:11px;color:var(--text2);font-family:monospace">${x.p}</div></div><input type="number" class="wq" value="${ws[x.p]||1}" min="1" onchange="swq('${x.p.replace(/'/g,'')}',this.value)"></div>`).join('');}
function fwh(){rwh(document.getElementById('whs').value);}
function tw(p){ws[p]=ws[p]?0:1;rwh(document.getElementById('whs').value);}
function swq(p,v){ws[p]=parseFloat(v)||1;}
function whNext(){items=[];Object.entries(ws).forEach(([p,q])=>{if(!q)return;const x=WH.find(i=>i.p===p);if(x)items.push({name:x.n,pn:p,qty:q,unit:'шт'});});if(!items.length){alert('Оберіть позиції');return;}showRv();}
function showRv(){document.getElementById('rmeta').innerHTML=`<strong>${user.executor}</strong><br>${user.aggregate?'&#x2699;&#xFE0F; '+user.aggregate+'<br>':''}${user.project?'&#x1F4C1; '+user.project+'<br>':''}${user.workplace?'&#x1F3ED; '+user.workplace:''}`;document.getElementById('rlist').innerHTML=items.map((x,i)=>`<div class="rr"><div><div>${i+1}. ${x.name}</div>${x.pn?`<div class="rp">${x.pn}</div>`:''}</div><div class="rq">${x.qty} ${x.unit||'шт'}</div></div>`).join('');go('review');}
function rvBack(){if(mode==='kit')go('kit');else if(mode==='manual')go('manual');else go('wh');}
async function submit(){const btn=document.getElementById('sbtn');btn.innerHTML='<span class="sp"></span>Відправляємо...';btn.disabled=true;const id='ЗАМ-'+Date.now().toString().slice(-6);const pay={reqId:id,executor:user.executor,aggregate:user.aggregate||'',project:user.project||'',workplace:user.workplace||'',type:mode==='kit'?'100% заміна '+(user.kitL||''):mode==='manual'?'Вручну':'Зі складу',createdAt:new Date().toLocaleString('uk-UA'),items:items.map(x=>`${x.name}${x.pn?' ['+x.pn+']':''} — ${x.qty} ${x.unit||'шт'}`).join('\n')};document.getElementById('rnum').textContent=id;let ok=false;if(GAS_URL&&GAS_URL!=='https://script.google.com/macros/s/AKfycbxkSGIOu2o1lJrIRPZ5o4OMuO3F-E3XN5qbbXbC2Wf9I2tYLl11SYgkHM8usQhkNmmZNQ/exec'){try{await fetch(GAS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(pay),headers:{'Content-Type':'application/json'}});ok=true;document.getElementById('sstatus').textContent='✅ Збережено в Google Sheets';}catch(e){}}try{const r=indexedDB.open('avronis_v2',1);r.onsuccess=e=>{try{const db=e.target.result;if(db.objectStoreNames.contains('requests')){db.transaction('requests','readwrite').objectStore('requests').add({executor:user.executor,aggregate:user.aggregate||'',project:user.project||'',workplace:user.workplace||'',items,status:'new',createdAt:new Date().toISOString(),note:pay.type+' (з QR)});}}catch(e2){}};} catch(e){}if(!ok)document.getElementById('sstatus').textContent='⚠️ Налаштуйте Google Sheets (інструкція в системі)';go('ok');}
function reset(){mode='';items=[];user={};ws={};['exec','agg','proj','wp'].forEach(id=>document.getElementById(id).value='');document.getElementById('mrows').innerHTML='<div class="ir"><input type="text" placeholder="Найменування" class="n"><input type="number" placeholder="К-сть" class="q" value="1" min="1"><button class="db" onclick="delRow(this)">&#x2715;</button></div>';document.getElementById('sbtn').innerHTML='&#x1F4CB; Подати заявку';document.getElementById('sbtn').disabled=false;go(0);}
</script>
