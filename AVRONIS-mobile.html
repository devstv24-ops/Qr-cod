
<!DOCTYPE html>
<html lang="uk">

<title>AVRONIS — Заявка</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background: #0b0f14; color: #e8edf3; font-size: 16px; }
.wrap { max-width: 500px; margin: 0 auto; padding: 20px 16px 80px; }

/* LOGO */
.logo { text-align: center; padding: 30px 0 24px; border-bottom: 1px solid #2a3a4f; margin-bottom: 24px; }
.logo-icon { font-size: 40px; display: block; margin-bottom: 8px; }
.logo-title { font-size: 22px; font-weight: 700; display: block; }
.logo-sub { font-size: 13px; color: #7a8fa6; margin-top: 6px; display: block; }

/* CHOICE BUTTONS */
.choice { display: block; width: 100%; padding: 20px 18px; margin-bottom: 12px; background: #111820; border: 2px solid #2a3a4f; border-radius: 14px; color: #e8edf3; text-align: left; cursor: pointer; text-decoration: none; }
.choice:active { background: #1a2230; border-color: #3d8ef0; }
.choice-icon { font-size: 30px; display: block; margin-bottom: 8px; }
.choice-title { font-size: 17px; font-weight: 700; display: block; margin-bottom: 4px; }
.choice-sub { font-size: 13px; color: #7a8fa6; display: block; }

/* SECTION HEADER */
.sh { font-size: 12px; font-weight: 700; color: #7a8fa6; text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 12px; }

/* BACK */
.back { display: block; background: none; border: none; color: #7a8fa6; font-size: 14px; padding: 0 0 18px; cursor: pointer; text-align: left; }

/* KIT BUTTONS */
.kit-btn { display: block; width: 100%; padding: 18px; margin-bottom: 10px; background: #111820; border: 2px solid #2a3a4f; border-radius: 12px; color: #e8edf3; font-size: 16px; font-weight: 600; text-align: left; cursor: pointer; }
.kit-btn:active { background: #1a2230; border-color: #3d8ef0; }
.kit-count { font-size: 12px; color: #7a8fa6; font-weight: 400; float: right; margin-top: 2px; }

/* FORM */
.fg { margin-bottom: 16px; }
.fg label { display: block; font-size: 12px; color: #7a8fa6; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.fg input { display: block; width: 100%; background: #1a2230; border: 2px solid #2a3a4f; border-radius: 10px; padding: 14px 16px; color: #e8edf3; font-size: 16px; outline: none; font-family: inherit; }
.fg input:focus { border-color: #3d8ef0; }

/* BUTTONS */
.btn { display: block; width: 100%; padding: 18px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 14px; text-align: center; font-family: inherit; }
.btn-blue { background: #3d8ef0; color: #fff; }
.btn-green { background: #2ecc71; color: #fff; }
.btn-grey { background: #1a2230; color: #e8edf3; border: 2px solid #2a3a4f; }
.btn:active { opacity: 0.8; }

/* MANUAL ROWS */
.item-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
.item-row .name { flex: 2; background: #1a2230; border: 2px solid #2a3a4f; border-radius: 10px; padding: 14px; color: #e8edf3; font-size: 15px; outline: none; font-family: inherit; }
.item-row .qty { flex: 0 0 75px; background: #1a2230; border: 2px solid #2a3a4f; border-radius: 10px; padding: 14px 10px; color: #e8edf3; font-size: 15px; outline: none; text-align: center; font-family: inherit; }
.item-row .del { flex: 0 0 44px; height: 50px; background: rgba(231,76,60,0.15); border: 2px solid rgba(231,76,60,0.3); border-radius: 10px; color: #e74c3c; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* WAREHOUSE */
.wh-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #2a3a4f; }
.wh-item:last-child { border-bottom: none; }
.wh-cb { width: 24px; height: 24px; flex-shrink: 0; accent-color: #3d8ef0; cursor: pointer; }
.wh-name { flex: 1; font-size: 14px; line-height: 1.4; }
.wh-pn { font-size: 11px; color: #7a8fa6; font-family: monospace; margin-top: 2px; }
.wh-qty { width: 65px; background: #1a2230; border: 2px solid #2a3a4f; border-radius: 8px; padding: 10px; color: #e8edf3; font-size: 14px; text-align: center; outline: none; font-family: inherit; }
.wh-search { display: block; width: 100%; background: #1a2230; border: 2px solid #2a3a4f; border-radius: 10px; padding: 14px 16px; color: #e8edf3; font-size: 16px; outline: none; margin-bottom: 14px; font-family: inherit; }
.wh-search:focus { border-color: #3d8ef0; }

/* REVIEW */
.meta-box { background: #111820; border: 1px solid #2a3a4f; border-radius: 10px; padding: 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.8; color: #7a8fa6; }
.meta-box strong { color: #e8edf3; }
.review-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #2a3a4f; gap: 10px; }
.review-row:last-child { border-bottom: none; }
.review-name { font-size: 14px; flex: 1; }
.review-pn { font-size: 11px; color: #7a8fa6; font-family: monospace; margin-top: 2px; }
.review-qty { font-weight: 700; color: #3d8ef0; flex-shrink: 0; font-size: 14px; }

/* SUCCESS */
.success { text-align: center; padding: 60px 20px; }
.success-icon { font-size: 80px; display: block; margin-bottom: 20px; }
.success-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
.success-sub { font-size: 15px; color: #7a8fa6; line-height: 1.6; }
.req-num { display: inline-block; background: #1a2230; border: 2px solid #2a3a4f; border-radius: 10px; padding: 10px 20px; font-family: monospace; font-size: 18px; color: #3d8ef0; margin: 16px 0; }
.save-status { font-size: 13px; color: #7a8fa6; margin-top: 8px; }

/* SPINNER */
.spin { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }

/* STEPS */
.step { display: none; }
.step.active { display: block; }
</style>
</head>

    <div class="sh">Ваші дані</div>
    <div class="fg"><label>Виконавець *</label><input type="text" id="exec" placeholder="Прізвище та ініціали" autocomplete="name"></div>

    <button class="btn btn-blue" onclick="s1next()">Далі →</button>
  </div>

  <!-- КРОК 2а: Вибір агрегату -->
  <div class="step" id="s-kit">
    <button class="back" onclick="goStep('s1','kit')">← Назад</button>
    <div class="sh">Оберіть агрегат</div>
    <button class="kit-btn" onclick="selKit('kau115am')">⚙️ КАУ-115АМ <span class="kit-count">31 поз.</span></button>
    <button class="kit-btn" onclick="selKit('kau30b')">⚙️ КАУ-30Б <span class="kit-count">36 поз.</span></button>
    <button class="kit-btn" onclick="selKit('ra60b')">⚙️ РА-60Б <span class="kit-count">26 поз.</span></button>
    <button class="kit-btn" onclick="selKit('ug50')">⚙️ УГ-50 <span class="kit-count">19 поз.</span></button>
  </div>

  <!-- КРОК 2б: Вручну -->
  <div class="step" id="s-manual">
    <button class="back" onclick="goStep('s1','manual')">← Назад</button>
    <div class="sh">Введіть позиції</div>
    <div id="mrows">
      <div class="item-row">
        <input type="text" placeholder="Найменування" class="name">
        <input type="number" placeholder="К-сть" class="qty" value="1" min="1">
        <button class="del" onclick="delRow(this)">✕</button>
      </div>
    </div>
    <button class="btn btn-grey" style="margin-top:8px" onclick="addRow()">＋ Додати рядок</button>
    <button class="btn btn-blue" onclick="manNext()">Переглянути →</button>
  </div>

  <!-- КРОК 2в: Зі складу -->

    <button class="back" onclick="goStep('s1','wh')">← Назад</button>
    <div class="sh">Обрати зі складу</div>
    <input type="search" class="wh-search" id="whs" placeholder="🔍 Пошук за назвою або PN..." oninput="filterWh()">
    <div id="whl"></div>
    <button class="btn btn-blue" onclick="whNext()">Переглянути →</button>
  </div>

  <!-- КРОК 3: Перегляд -->

    <button class="back" onclick="reviewBack()">← Назад</button>
    <div class="sh">Перевірте заявку</div>
    <div id="rmeta" class="meta-box"></div>
    <div id="rlist"></div>
    <button class="btn btn-green" id="sbtn" onclick="submitReq()">📋 Подати заявку</button>
  </div>

    </div>
  </div>

</div>

function goStep(id, type) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  if (type) mode = type;
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
  if (id === 's-wh') renderWh('');
}

// ===== КРОК 1 =====
function s1next() {
  const exec = document.getElementById('exec').value.trim();
  if (!exec) { alert('Будь ласка, введіть ПІБ виконавця'); return; }
  user = {
    executor: exec,
    aggregate: document.getElementById('agg').value.trim(),
    project: document.getElementById('proj').value.trim(),
    workplace: document.getElementById('wp').value.trim()
  };
  if (mode === 'kit') goStep('s-kit');
  else if (mode === 'manual') goStep('s-manual');
  else goStep('s-wh');
}

// ===== КОМПЛЕКТ =====
function selKit(key) {
  const kit = KITS[key];
  items = kit.items.map(x => ({ name: x.n, pn: x.pn, qty: x.q, unit: 'шт' }));
  user.aggregate = user.aggregate || kit.label;
  user.kitLabel = kit.label;
  showReview();
}

// ===== ВРУЧНУ =====
function addRow() {
  const div = document.createElement('div');
  div.className = 'item-row';
  div.innerHTML = '<input type="text" placeholder="Найменування" class="name"><input type="number" placeholder="К-сть" class="qty" value="1" min="1"><button class="del" onclick="delRow(this)">✕</button>';
  document.getElementById('mrows').appendChild(div);
}
function delRow(btn) {
  if (document.querySelectorAll('.item-row').length > 1) btn.closest('.item-row').remove();
}
function manNext() {
  items = [];
  document.querySelectorAll('.item-row').forEach(row => {
    const name = row.querySelector('.name').value.trim();
    if (!name) return;
    items.push({ name, pn: '', qty: parseFloat(row.querySelector('.qty').value) || 1, unit: 'шт' });
  });
  if (!items.length) { alert('Введіть хоча б одну позицію'); return; }
  showReview();
}

// ===== ЗІ СКЛАДУ =====
function renderWh(q) {
  const filtered = WH.filter(x => !q || x.n.toLowerCase().includes(q.toLowerCase()) || x.p.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('whl').innerHTML = filtered.map(x => `
    <div class="wh-item">
      <input type="checkbox" class="wh-cb" ${whSel[x.p] ? 'checked' : ''} onchange="toggleWh('${x.p.replace(/'/g, "\\'")}')">
      <div class="wh-name">
        <div>${x.n}</div>
        <div class="wh-pn">${x.p}</div>
      </div>
      <input type="number" class="wh-qty" value="${whSel[x.p] || 1}" min="1" onchange="setWhQty('${x.p.replace(/'/g, "\\'")}', this.value)">
    </div>`).join('');
}
function filterWh() { renderWh(document.getElementById('whs').value); }
function toggleWh(p) { whSel[p] = whSel[p] ? 0 : 1; renderWh(document.getElementById('whs').value); }
function setWhQty(p, v) { whSel[p] = parseFloat(v) || 1; }
function whNext() {
  items = [];
  Object.entries(whSel).forEach(([p, q]) => {
    if (!q) return;
    const x = WH.find(i => i.p === p);
    if (x) items.push({ name: x.n, pn: p, qty: q, unit: 'шт' });
  });
  if (!items.length) { alert('Оберіть хоча б одну позицію'); return; }
  showReview();
}

// ===== ПЕРЕГЛЯД =====
function showReview() {
  document.getElementById('rmeta').innerHTML =
    '<strong>' + user.executor + '</strong><br>' +
    (user.aggregate ? '⚙️ ' + user.aggregate + '<br>' : '') +
    (user.project ? '📁 ' + user.project + '<br>' : '') +
    (user.workplace ? '🏭 ' + user.workplace : '');
  document.getElementById('rlist').innerHTML = items.map((x, i) =>
    '<div class="review-row">' +
    '<div><div class="review-name">' + (i+1) + '. ' + x.name + '</div>' +
    (x.pn ? '<div class="review-pn">' + x.pn + '</div>' : '') + '</div>' +
    '<div class="review-qty">' + x.qty + ' ' + (x.unit || 'шт') + '</div></div>'
  ).join('');
  goStep('s-review');
}
function reviewBack() {
  if (mode === 'kit') goStep('s-kit');
  else if (mode === 'manual') goStep('s-manual');
  else goStep('s-wh');
}

// ===== ВІДПРАВКА =====
async function submitReq() {
  const btn = document.getElementById('sbtn');
  btn.innerHTML = '<span class="spin"></span>Відправляємо...';
  btn.disabled = true;

  const reqId = 'ЗАМ-' + Date.now().toString().slice(-6);
  const payload = {
    reqId,
    executor: user.executor,
    aggregate: user.aggregate || '',
    project: user.project || '',
    workplace: user.workplace || '',
    type: mode === 'kit' ? '100% заміна ' + (user.kitLabel || '') : mode === 'manual' ? 'Вручну' : 'Зі складу',
    createdAt: new Date().toLocaleString('uk-UA'),
    items: items.map(x => x.name + (x.pn ? ' [' + x.pn + ']' : '') + ' — ' + x.qty + ' ' + (x.unit || 'шт')).join('\n')
  };

  document.getElementById('rnum').textContent = reqId;
  let saved = false;

  try {
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'application/json' }
    });
    saved = true;
    document.getElementById('sstatus').textContent = '✅ Збережено в Google Sheets';
  } catch (e) {
    document.getElementById('sstatus').textContent = '⚠️ Помилка збереження — перевірте інтернет';
  }

  goStep('s-ok');
}

// ===== СКИНУТИ =====
function reset() {
  mode = ''; items = []; user = {}; whSel = {};
  ['exec','agg','proj','wp'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('mrows').innerHTML = '<div class="item-row"><input type="text" placeholder="Найменування" class="name"><input type="number" placeholder="К-сть" class="qty" value="1" min="1"><button class="del" onclick="delRow(this)">✕</button></div>';
  document.getElementById('sbtn').innerHTML = '📋 Подати заявку';
  document.getElementById('sbtn').disabled = false;
  goStep('s0');
}
</script>
